name: Release

# `packaging` spec, "A version tag publishes downloadable binaries" (design D1): a
# `v*` tag is the single source of truth for what shipped. This workflow never
# invokes wasm-pack or npm — the frontend artifacts are vendored in
# crates/looqlog/assets/ (ADR-0008), and CI's frontend-artifact-staleness job already
# guards their freshness on every push to main.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # design D1: the tag is the single source of truth. Fail before any binary is
  # built rather than publish one whose `--version` output contradicts its own
  # release.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches the workspace version in Cargo.toml
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${PKG_VERSION} in Cargo.toml"
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

  # design D2: musl for Linux (static, no glibc floor). Each job smoke-tests the
  # binary it just built (design D3) and records its size (design D4) before
  # anything is staged for the publish job.
  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # design D7: a native Intel runner, not macos-latest (arm64) — its image
          # does not list Rosetta 2, so an x86_64 binary built there could not be
          # smoke-tested on the machine that built it.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p looqlog --target ${{ matrix.target }}

      - name: Locate built binary
        id: bin
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            EXT=".exe"
          fi
          echo "path=target/${{ matrix.target }}/release/looqlog${EXT}" >> "$GITHUB_OUTPUT"
          echo "ext=${EXT}" >> "$GITHUB_OUTPUT"

      # design D3: proves the artifact runs, not just that it links. Same four
      # checks on every target, `shell: bash` everywhere (Git Bash on Windows).
      - name: Smoke test
        shell: bash
        run: ./scripts/smoke-release-binary.sh "${{ steps.bin.outputs.path }}" "${{ env.VERSION }}"

      # design D4: recorded on every target, enforced on Linux x86_64.
      - name: Measure size
        id: size
        shell: bash
        run: |
          BYTES=$(wc -c < "${{ steps.bin.outputs.path }}" | tr -d ' ')
          MIB=$(awk "BEGIN { printf \"%.2f\", ${BYTES}/1048576 }")
          echo "bytes=${BYTES}" >> "$GITHUB_OUTPUT"
          {
            echo "### looqlog ${{ matrix.target }}"
            echo "Size: ${BYTES} bytes (~${MIB} MiB)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce TDR §5 budget (~10 MB, Linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          BUDGET=$((10 * 1024 * 1024))
          if [ "${{ steps.size.outputs.bytes }}" -gt "${BUDGET}" ]; then
            echo "::error::linux x86_64 binary is ${{ steps.size.outputs.bytes }} bytes, over the TDR §5 ~10MB budget (${BUDGET} bytes)"
            exit 1
          fi

      - name: Stage release asset
        id: stage
        shell: bash
        run: |
          ASSET_NAME="looqlog-${VERSION}-${{ matrix.target }}${{ steps.bin.outputs.ext }}"
          mkdir -p dist
          cp "${{ steps.bin.outputs.path }}" "dist/${ASSET_NAME}"
          echo "${{ steps.size.outputs.bytes }}" > "dist/${ASSET_NAME}.size"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.asset_name }}
          path: dist/

  # A target that fails to build or smoke-test never reaches this job, so it never
  # reaches the Releases page (design D3).
  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release body with recorded sizes (design D4)
        shell: bash
        run: |
          {
            echo "## looqlog ${VERSION}"
            echo
            echo "Binary sizes against TDR §5's budget (~10 MB for Linux x86_64, ~10.5 MB total):"
            echo
            for f in artifacts/*/*.size; do
              asset="$(basename "$f" .size)"
              bytes="$(cat "$f")"
              mib=$(awk "BEGIN { printf \"%.2f\", ${bytes}/1048576 }")
              echo "- \`${asset}\`: ${bytes} bytes (~${mib} MiB)"
            done
          } > release-body.md
        env:
          VERSION: ${{ needs.check-version.outputs.version }}

      - name: Collect binary assets
        run: |
          mkdir -p release-assets
          find artifacts -type f ! -name '*.size' -exec cp {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: looqlog ${{ needs.check-version.outputs.version }}
          body_path: release-body.md
          files: release-assets/*

      # 2026-09-01 devlog entry: this workflow reported success against v0.2.0 twice —
      # two green runs, on two separate days — and no release existed for twelve days.
      # `releases/latest` kept resolving to v0.1.0 and `releases/tags/v0.2.0` returned
      # `Not Found` the whole time; both READMEs meanwhile told readers to `curl` an
      # asset name that 404'd. A green job here only proves the steps above exited
      # zero, not that a release exists. This step asks the API directly.
      - name: Verify the release exists and carries the uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # design D2: only a 404 is retryable — the release was just created and the
          # REST API is read-after-write eventually consistent, so an immediate query
          # can race the write. Any other failure (auth, rate limit) is real and must
          # fail now rather than spend the retry budget on something that will never
          # resolve on its own.
          RELEASE=""
          for attempt in 1 2 3 4 5; do
            set +e
            BODY="$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>/dev/null)"
            CODE=$?
            set -e
            if [ "$CODE" -eq 0 ]; then
              RELEASE="$BODY"
              break
            fi
            if [ "$(echo "$BODY" | jq -r '.status // empty')" != "404" ]; then
              echo "::error::querying the release for tag ${TAG} failed with something other than a missing release: $(echo "$BODY" | jq -r '.message // "unknown error"')"
              exit 1
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::no release exists for tag ${TAG} after 5 attempts — every publishing step above exited zero but nothing was published"
              exit 1
            fi
            sleep 3
          done

          # design D3: checked even though `release.yml` passes no `draft` input and
          # action-gh-release publishes by default, so this "should" be unreachable —
          # "should be unreachable" is exactly what was assumed about a release
          # existing at all before the 2026-09-01 incident. A draft satisfies "the
          # release exists" while satisfying none of what a user following the
          # install instructions needs.
          if [ "$(echo "$RELEASE" | jq -r '.draft')" = "true" ]; then
            echo "::error::release for tag ${TAG} exists but is a draft — not reachable by anyone following the install instructions"
            exit 1
          fi

          # design D1: compare against release-assets/, the directory this run
          # actually built the release from — not names recomputed from the target
          # matrix. Recomputing would repeat the exact naming expression that
          # produced the 2026-09-01 mismatch (looq-* vs looqlog-*) and agree with
          # itself even if that expression is wrong again.
          EXPECTED="$(find release-assets -type f -exec basename {} \; | sort)"
          ACTUAL="$(echo "$RELEASE" | jq -r '.assets[].name' | sort)"

          MISSING="$(comm -23 <(echo "$EXPECTED") <(echo "$ACTUAL"))"
          UNEXPECTED="$(comm -13 <(echo "$EXPECTED") <(echo "$ACTUAL"))"

          if [ -n "$MISSING" ] || [ -n "$UNEXPECTED" ]; then
            echo "::error::release ${TAG} does not carry exactly the assets this run uploaded"
            while IFS= read -r name; do
              [ -n "$name" ] && echo "::error::missing from the release: ${name} — uploaded by this run, absent from what the API reports"
            done <<< "$MISSING"
            while IFS= read -r name; do
              [ -n "$name" ] && echo "::error::unexpected on the release: ${name} — on the release but not among this run's uploads"
            done <<< "$UNEXPECTED"
            exit 1
          fi

          COUNT="$(echo "$ACTUAL" | grep -c .)"
          echo "confirmed: release '$(echo "$RELEASE" | jq -r '.name')' for tag ${TAG} carries ${COUNT} asset(s), matching release-assets/ exactly" | tee -a "$GITHUB_STEP_SUMMARY"
