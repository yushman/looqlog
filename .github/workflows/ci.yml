name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # packaging spec, "Node-less build": cargo build/install must not need a JS
  # toolchain. This job never installs Node/npm/wasm-pack — only the committed
  # assets/ (ADR-0008) are used.
  build-no-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo package --list -p looq

  # ADR-0005: looq-core must stay usable by a future native (MCP) adapter as well
  # as the wasm adapter, so it must never depend on wasm-bindgen/web-sys, and must
  # never touch the filesystem itself (log-parsing-core task 2.4).
  adr-0005-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: looq-core must not depend on wasm-bindgen or web-sys
        run: |
          if cargo tree -p looq-core -i wasm-bindgen 2>/dev/null; then
            echo "::error::looq-core depends on wasm-bindgen, violating ADR-0005"
            exit 1
          fi
          if cargo tree -p looq-core -i web-sys 2>/dev/null; then
            echo "::error::looq-core depends on web-sys, violating ADR-0005"
            exit 1
          fi
      - name: looq-core's library source must not touch std::fs
        run: |
          if grep -rn "std::fs::" crates/looq-core/src/; then
            echo "::error::crates/looq-core/src/ touches std::fs, violating ADR-0005"
            exit 1
          fi

  # packaging spec, "Vendored artifacts are verifiably current": rebuild
  # assets/ from source and fail if the committed copy has drifted (ADR-0008 D2).
  # Runs on macOS, unlike every other job here, and deliberately so: this job diffs
  # a fresh build against the committed artifacts byte-for-byte, and rustc does not
  # produce byte-identical wasm across host operating systems. With rustc, binaryen
  # and Cargo.lock all identical, an arm64-macOS build and an x86_64-Linux build of
  # the same source still differed by 12 bytes — so a Linux runner would report
  # "stale" forever while nothing was stale. The artifacts are built and committed
  # from arm64 macOS; the checker has to match that. If that ever stops being true,
  # this job's platform moves with it.
  frontend-artifact-staleness:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wasm-pack
        run: npm install -g wasm-pack
      # Pinned: wasm-opt is part of the artifact, so an unpinned binaryen makes the
      # rebuilt core.wasm differ from the committed one with no source change.
      # Without this, wasm-pack downloads its own copy — which also failed
      # intermittently, taking the whole job down with it.
      - name: Install binaryen (wasm-opt)
        run: |
          V=version_132
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${V}/binaryen-${V}-arm64-macos.tar.gz" \
            | tar xz
          echo "$PWD/binaryen-${V}/bin" >> "$GITHUB_PATH"
      - name: Rebuild frontend artifacts
        run: |
          set +e
          out=$(./scripts/build-frontend.sh 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            # Job logs need admin rights over the API; annotations are readable on
            # a public repo, so a failure here stays diagnosable from outside.
            echo "$out" | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: Fail if crates/looq/assets/ drifted from source
        run: |
          if ! git diff --quiet -- crates/looq/assets/; then
            echo "::error::crates/looq/assets/ is stale — committed frontend artifacts do not match a fresh build."
            echo "Run ./scripts/build-frontend.sh and commit the result."
            git diff --stat -- crates/looq/assets/
            git diff --stat -- crates/looq/assets/ | while IFS= read -r l; do echo "::error::drift: $l"; done
            for f in $(git diff --name-only -- crates/looq/assets/); do
              echo "::error::size now $(wc -c < "$f") vs committed $(git show HEAD:"$f" | wc -c) — $f"
              git show HEAD:"$f" > /tmp/committed.bin
              n=$(cmp -l /tmp/committed.bin "$f" 2>/dev/null | wc -l | tr -d ' ')
              echo "::error::differing bytes: $n — $f"
              cmp -l /tmp/committed.bin "$f" 2>/dev/null | head -8 \
                | while IFS= read -r l; do echo "::error::  byte $l"; done
              diff <(strings -a /tmp/committed.bin | sort -u) <(strings -a "$f" | sort -u) \
                | head -10 | while IFS= read -r l; do echo "::error::  strings: $l"; done
            done
            exit 1
          fi

  # app-shell / wasm-bridge specs: strict TypeScript build and type check, wired
  # into CI so a type error blocks the build (browser-app-shell task 1.2).
  frontend-typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build

  # wasm-bridge spec, "Type check catches a shape change" (task 2.2): a deliberate
  # field rename in the hand-written TS mirror, with a usage site left stale,
  # proves `tsc --noEmit` actually fails instead of silently compiling. See
  # web/scripts/verify-rename-check.sh for what this does and does not prove.
  frontend-type-check-catches-rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: bash scripts/verify-rename-check.sh
