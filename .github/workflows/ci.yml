name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # packaging spec, "Node-less build": cargo build/install must not need a JS
  # toolchain. This job never installs Node/npm — only the committed
  # assets/ (ADR-0008) are used.
  build-no-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo package --list -p looqlog

  # ADR-0005: looqlog-core must stay target-agnostic — reusable by the server and a
  # future native (MCP) adapter — so it must never depend on wasm-bindgen/web-sys, and
  # must never touch the filesystem itself (log-parsing-core task 2.4).
  adr-0005-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: looqlog-core must not depend on wasm-bindgen or web-sys
        run: |
          if cargo tree -p looqlog-core -i wasm-bindgen 2>/dev/null; then
            echo "::error::looqlog-core depends on wasm-bindgen, violating ADR-0005"
            exit 1
          fi
          if cargo tree -p looqlog-core -i web-sys 2>/dev/null; then
            echo "::error::looqlog-core depends on web-sys, violating ADR-0005"
            exit 1
          fi
      - name: looqlog-core's library source must not touch std::fs
        run: |
          if grep -rn "std::fs::" crates/looqlog-core/src/; then
            echo "::error::crates/looqlog-core/src/ touches std::fs, violating ADR-0005"
            exit 1
          fi

  # packaging spec, "Vendored artifacts are verifiably current": rebuild
  # assets/ (JS bundle and stylesheet only — no WebAssembly since ADR-0010) from
  # source and fail if the committed copy has drifted (ADR-0008 D2). The artifacts are
  # built and committed from arm64 macOS, so the checker runs there too.
  frontend-artifact-staleness:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: Node drives Vite, whose output is diffed byte-for-byte. The other copy
      # of this number is `EXPECTED_NODE_MAJOR` in scripts/build-frontend.sh; Vite
      # itself is pinned exactly in web/package.json.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Rebuild frontend artifacts
        run: |
          set +e
          out=$(./scripts/build-frontend.sh 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            # Job logs need admin rights over the API; annotations are readable on
            # a public repo, so a failure here stays diagnosable from outside.
            echo "$out" | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: Fail if crates/looqlog/assets/ drifted from source
        run: |
          if ! git diff --quiet -- crates/looqlog/assets/; then
            echo "::error::crates/looqlog/assets/ is stale — committed frontend artifacts do not match a fresh build."
            echo "Run ./scripts/build-frontend.sh and commit the result."
            git diff --stat -- crates/looqlog/assets/
            git diff --stat -- crates/looqlog/assets/ | while IFS= read -r l; do echo "::error::drift: $l"; done
            for f in $(git diff --name-only -- crates/looqlog/assets/); do
              echo "::error::size now $(wc -c < "$f") vs committed $(git show HEAD:"$f" | wc -c) — $f"
              git show HEAD:"$f" > /tmp/committed.bin
              n=$(cmp -l /tmp/committed.bin "$f" 2>/dev/null | wc -l | tr -d ' ')
              echo "::error::differing bytes: $n — $f"
              cmp -l /tmp/committed.bin "$f" 2>/dev/null | head -8 \
                | while IFS= read -r l; do echo "::error::  byte $l"; done
              diff <(strings -a /tmp/committed.bin | sort -u) <(strings -a "$f" | sort -u) \
                | head -10 | while IFS= read -r l; do echo "::error::  strings: $l"; done
            done
            echo "::error::the rebuilt crates/looqlog/assets/ is attached to this run as a downloadable artifact — see the Artifacts section below."
            exit 1
          fi
      # The error annotations above describe the drift but don't keep the bytes; this
      # step does. The committed side is always recoverable from git, but the rebuilt
      # side exists only inside this runner — without this, an unexplained drift is
      # rebuilt over the moment someone reruns the job, losing the only evidence of
      # what actually changed. Separate step because the diff step above exits non-zero on drift.
      - name: Upload rebuilt assets on drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets-${{ github.run_id }}
          path: crates/looqlog/assets/

  # app-shell / query-api specs: strict TypeScript build and type check, wired
  # into CI so a type error blocks the build (browser-app-shell task 1.2).
  frontend-typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build

  # query-api: "Type check catches a shape change" (task 2.2): a deliberate
  # field rename in the hand-written TS mirror, with a usage site left stale,
  # proves `tsc --noEmit` actually fails instead of silently compiling. See
  # web/scripts/verify-rename-check.sh for what this does and does not prove.
  frontend-type-check-catches-rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: bash scripts/verify-rename-check.sh
