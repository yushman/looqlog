[package]
name = "looqlog-core"
description = "Target-agnostic log parsing core for looqlog (no wasm-bindgen/web-sys/std::fs; ADR-0005)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# Lower than the binary's 1.86 because this crate's runtime dependencies are only
# `serde_json` and `chrono`. `criterion` pulls `clap` (1.85), but a dev-dependency
# constrains benchmarking here, not anyone who depends on this crate.
rust-version = "1.71"
keywords = ["log", "logs", "parser", "logfmt", "jsonl"]
categories = ["parser-implementations", "development-tools"]

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `regex` was tried for the leading-timestamp pattern (task 4/5) and dropped after
# measurement showed it alone added ~1MB to core.wasm, ~3x the whole ~300KB TDR §5
# budget (see docs/devlog.md). Replaced with a hand-rolled byte scanner
# (`timestamp::match_leading_timestamp`) — design.md D9 named this exact fallback.

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parse"
harness = false

[lints.clippy]
# ADR-0005: this crate must stay usable from both the wasm adapter and a future
# native adapter. It must never depend on wasm-bindgen, web-sys, or std::fs.
