[package]
name = "looqlog-wasm"
description = "wasm-bindgen adapter exposing looqlog-core to the browser (ADR-0005)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Never published: this is a `cdylib` consumed by `wasm-pack`, whose output is
# vendored into `crates/looqlog/assets/` (ADR-0008). Nobody installs it from the
# registry, and publishing it would mean carrying a third crate version forever.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
looqlog-core = { path = "../looqlog-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# release-hardening: rustc 1.95's wasm32-unknown-unknown codegen emits
# bulk-memory (`memory.copy`/`memory.fill`), sign-extension, mutable-globals and
# nontrapping-float-to-int instructions by default; `wasm-pack`'s plain `wasm-opt
# -O` invocation doesn't enable any of those features on its own, so `wasm-opt`
# rejected the module outright feature-by-feature as each was hit (first
# `memory.copy`, then `i32.trunc_sat_f64_s`) — not a regression in this crate's own
# code (untouched by release-hardening), a toolchain/wasm-pack version mismatch
# caught while re-verifying the build in this change. Flags below match rustc's
# current wasm32-unknown-unknown default feature set so `wasm-opt` accepts what
# rustc actually emits, rather than disabling optimization entirely.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory-opt",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    # Drop the `producers` section. It records the versions of the tools that
    # built the module — including `walrus`, a transitive dependency of the
    # wasm-bindgen CLI that `cargo install` resolves fresh on every machine. A
    # locally cached CLI built against walrus 0.26.4 and a CI-built one on 0.26.5
    # produced artifacts differing by exactly one byte: the `4` and the `5`. The
    # section is informational, so stripping it makes the artifact depend on the
    # source rather than on which tool versions happened to be resolved.
    "--strip-producers",
]
