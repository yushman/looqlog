[package]
name = "looq-core"
description = "Target-agnostic log parsing core for looq (no wasm-bindgen/web-sys/std::fs; ADR-0005)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `regex` was tried for the leading-timestamp pattern (task 4/5) and dropped after
# measurement showed it alone added ~1MB to core.wasm, ~3x the whole ~300KB TDR §5
# budget (see docs/devlog.md). Replaced with a hand-rolled byte scanner
# (`timestamp::match_leading_timestamp`) — design.md D9 named this exact fallback.

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parse"
harness = false

[lints.clippy]
# ADR-0005: this crate must stay usable from both the wasm adapter and a future
# native adapter. It must never depend on wasm-bindgen, web-sys, or std::fs.
