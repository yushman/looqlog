[package]
name = "looqlog"
description = "Single-binary CLI that opens a local web UI for a log file or stdin stream"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# Measured, not guessed: the floor comes from `idna_adapter`/`icu_*`, reached
# transitively through `webbrowser` → `url`. `axum` wants 1.80 and `clap` 1.85, so
# nothing here is close to the 1.74 the docs used to claim.
rust-version = "1.86"
keywords = ["log", "logs", "viewer", "cli", "wasm"]
categories = ["command-line-utilities", "development-tools", "visualization"]

[[bin]]
name = "looqlog"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.6", features = ["derive"] }
# `version` is required to publish: crates.io drops the `path` and resolves the
# dependency from the registry, so `looqlog-core` must be published first.
looqlog-core = { path = "../looqlog-core", version = "0.2.0" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webbrowser = "1.2.4"

[dev-dependencies]
futures-util = "=0.3.31"
tokio-tungstenite = "0.30.0"
