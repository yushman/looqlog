<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>looqlog</title>
  <script type="module" crossorigin src="/assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index.css">
</head>
<body>
  <div class="topbar">
    <h1><span class="brand-mark" aria-hidden="true"></span>looqlog</h1>
    <!-- Wired by web/src/theme.ts (`theming` spec, design.md D6): applies the
         stored/system theme before the button exists, then this becomes the
         explicit override toggle (Auto -> Light -> Dark -> Auto). -->
    <button type="button" id="theme-toggle" class="theme-toggle"></button>
  </div>
  <!-- The run mode is stated by the workspace's own topbar row (web/src/components/
       looqlog-workspace.ts), which is per-mode content — a hardcoded "file mode" line
       here was wrong in stdin mode. -->
  <!-- __LOOQLOG_MODE__ is substituted server-side (crates/looqlog/src/server.rs) with a
       small trusted JSON object naming what this path shows and, for the stdin source,
       the configured --max-lines: {"mode":"landing"}, {"mode":"file"} or
       {"mode":"stdin","maxLines":N}. looqlog-app.ts routes on the path and reads this
       to decide whether a source mounts the file-mode UI or the live-tail UI
       (live-tail-ui spec). In `vite dev` (no backend), this stays the literal
       placeholder string, which looqlog-app.ts treats as file mode. -->
  <template id="mode-template">__LOOQLOG_MODE__</template>
  <!-- __LOOQLOG_TOKEN__ is substituted server-side (crates/looqlog/src/assets.rs,
       `security` spec, design.md D1) with a random per-process hex token. Read by
       web/src/token.ts and presented as the first message on `/ws` and in the
       `/upload` header, never placed in a URL. In `vite dev` (no backend) this stays the
       literal placeholder, which is treated as "no token" — `/ws` isn't reachable
       under `vite dev` anyway (there's no backend process to serve it). -->
  <template id="token-template">__LOOQLOG_TOKEN__</template>
  <looqlog-app></looqlog-app>
</body>
</html>
