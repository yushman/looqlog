[workspace]
resolver = "2"
members = [
    "crates/looqlog",
    "crates/looqlog-core",
    "crates/looqlog-wasm",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yushman/looqlog"
homepage = "https://github.com/yushman/looqlog"

[profile.release]
opt-level = "s"
lto = true
# release-hardening: strip debug symbols from the distributed binary (smaller
# artifact, no local path/symbol leakage in the release build). `core.wasm` is
# built by wasm-pack/wasm-opt separately (scripts/build-frontend.sh) and is
# unaffected by this workspace profile.
strip = true
